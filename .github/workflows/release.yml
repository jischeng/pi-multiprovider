name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm provenance (OIDC).
  id-token: write

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      # typecheck + vitest + tsdown build; `npm publish` runs prepack again.
      - name: Checks
        run: bun run check

      # Publishes via Trusted Publishing (OIDC) when no token is provided.
      # A brand-new package cannot use trusted publishing until it exists, so a
      # first release can be published with an `NPM_TOKEN` repository secret;
      # remove that secret afterwards to go back to OIDC.
      - name: Detect npm token
        id: npm-token
        run: echo "available=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (trusted publishing)
        if: steps.npm-token.outputs.available != 'true'
        run: npm publish --provenance --access public

      - name: Publish to npm (token)
        if: steps.npm-token.outputs.available == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
